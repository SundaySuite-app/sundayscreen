name: Release

# Signed desktop builds for macOS (aarch64) and Windows, cut from a `v*` tag.
# The GitHub release is created as a DRAFT — a human publishes it, and then
# `node scripts/promote-release.mjs <channel> <tag>` tells the update Worker
# which published tag each ring serves. The tag alone ships nothing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only on this repo — creating the draft
# release needs an explicit grant ("Resource not accessible by integration"
# was the whole first v0.9.0-beta.1 run's Windows failure).
permissions:
  contents: write

jobs:
  build:
    # A dispatch from a BRANCH would create a draft release literally tagged
    # with the branch name. Refuse anything that is not a tag.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: ""
          - platform: windows-latest
            # MSI cannot express `-beta.N` (ProductVersion is three numeric
            # fields), so beta tags build NSIS only; stable tags build both.
            args: ${{ contains(github.ref_name, '-beta.') && '--bundles nsis' || '' }}
    runs-on: ${{ matrix.platform }}
    env:
      # `secrets` is not a recognized context in step-level `if` (GitHub
      # rejected the whole workflow file for it) — so the presence check is
      # computed here, where secrets ARE allowed, and steps test the flag.
      HAVE_MAC_CERTS: ${{ secrets.MAC_CERTS != '' }}
    steps:
      - name: Refuse to run on a non-tag ref
        if: ${{ github.ref_type != 'tag' }}
        shell: bash
        run: |
          echo "::error::Release builds only run from a v* tag (got ${{ github.ref }})."
          exit 1

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # macOS code signing is armed ONLY when the certificate secret exists.
      # These cannot be plain `env:` lines on the build step: an UNSET secret
      # interpolates to an empty string, and an empty APPLE_CERTIFICATE still
      # enters the import path and fails the build ("failed to import
      # keychain certificate" — proven by the first v0.9.0-beta.1 run). The
      # suite's empty-≠-absent lesson, again. The secret NAMES are the
      # Electron-era MAC_CERTS*, mapped onto tauri's APPLE_* env.
      - name: Arm macOS code signing (certificate secret present)
        if: ${{ runner.os == 'macOS' && env.HAVE_MAC_CERTS == 'true' }}
        shell: bash
        env:
          MAC_CERTS: ${{ secrets.MAC_CERTS }}
          MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
        run: |
          {
            echo "APPLE_CERTIFICATE<<CERT_EOF"
            echo "$MAC_CERTS"
            echo "CERT_EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=$MAC_CERTS_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=Developer ID Application: Richard Fossland (784GN847G4)"
          } >> "$GITHUB_ENV"

      - name: Ad-hoc signing fallback (no certificate secret)
        if: ${{ runner.os == 'macOS' && env.HAVE_MAC_CERTS != 'true' }}
        shell: bash
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      - name: Build and draft the release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (the feed's signature chain). The key is
          # PASSWORDLESS — no PASSWORD env on purpose (empty ≠ absent).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Notarization is DELIBERATELY off: Apple's notary answers 403
          # ("required agreement missing") until the updated PLA is accepted
          # for team 784GN847G4. When the owner has accepted it, uncomment:
          #   APPLE_ID: ${{ secrets.APPLE_ID }}
          #   APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          #   APPLE_TEAM_ID: "784GN847G4"
          # NOTE: never set these to '' instead — an empty string still
          # enters the notarize path and fails the build.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "SundayScreen ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
          # `uploadUpdaterJson`, NOT `includeUpdaterJson` — the wrong name is
          # silently ignored and the feed would have no manifest.
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
