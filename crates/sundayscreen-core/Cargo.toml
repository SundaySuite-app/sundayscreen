[package]
name = "sundayscreen-core"
version = "0.1.0"
description = "Pure, GUI-free domain core for SundayScreen — settings, layout, timer, picker and group logic"
authors = ["Richard Fossland"]
license = "MIT"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Type generation for the frontend (run with `cargo test export_bindings`).
ts-rs = { version = "12", features = ["serde-compat"] }
